name: Build iDo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install dependencies
        working-directory: Tauri/ido-desktop
        run: npm ci

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          projectPath: Tauri/ido-desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'iDo ${{ github.ref_name }}'
          releaseBody: 'Official release'
          releaseDraft: false
          prerelease: false

      - name: Debug — list bundle output
        if: always()
        shell: bash
        run: |
          echo "=== Bundle files ==="
          find Tauri/ido-desktop/src-tauri/target -path '*/bundle/*' -type f 2>/dev/null | head -60 || echo "No bundle files"

      - name: Upload macOS DMG (aarch64)
        if: always() && matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        uses: actions/upload-artifact@v4
        with:
          name: iDo-macOS-aarch64
          path: Tauri/ido-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload macOS DMG (x86_64)
        if: always() && matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        uses: actions/upload-artifact@v4
        with:
          name: iDo-macOS-x86_64
          path: Tauri/ido-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload Windows installers
        if: always() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: iDo-Windows-installers
          path: |
            Tauri/ido-desktop/src-tauri/target/release/bundle/msi/*.msi
            Tauri/ido-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Linux packages
        if: always() && matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: iDo-Linux-packages
          path: |
            Tauri/ido-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            Tauri/ido-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
