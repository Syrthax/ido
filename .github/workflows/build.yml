name: Build iDo Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            arch: aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            arch: x86_64
          - platform: windows-latest
            args: ''
            arch: x86_64
          - platform: ubuntu-22.04
            args: ''
            arch: x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Tauri/ido-desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && matrix.args != '' && (contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Install frontend dependencies
        working-directory: Tauri/ido-desktop
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'iDo v__VERSION__'
          releaseBody: |
            ## iDo Desktop v__VERSION__

            A cross-platform, privacy-first task manager synced to Google Drive.

            ### Download
            | Platform | File | Notes |
            |----------|------|-------|
            | macOS (Apple Silicon) | `iDo_*_aarch64.dmg` | Recommended for M1/M2/M3 Macs |
            | macOS (Intel) | `iDo_*_x64.dmg` | For older Intel Macs |
            | Windows | `iDo_*_x64-setup.exe` / `.msi` | 64-bit Windows 10+ |
            | Linux | `iDo_*_amd64.AppImage` / `.deb` | Ubuntu/Debian and compatible |

            ### What's New
            See [CHANGELOG.md](https://github.com/Syrthax/ido/blob/main/CHANGELOG.md) for full details.
          releaseDraft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          projectPath: Tauri/ido-desktop
          args: ${{ matrix.args }}

      # ──────────────────────────────────────────────────────────────
      # Upload per-platform artifacts (available even without a tag)
      # ──────────────────────────────────────────────────────────────
      - name: Upload macOS DMG (aarch64)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        uses: actions/upload-artifact@v4
        with:
          name: iDo-macOS-aarch64-dmg
          path: Tauri/ido-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload macOS DMG (x86_64)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        uses: actions/upload-artifact@v4
        with:
          name: iDo-macOS-x86_64-dmg
          path: Tauri/ido-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload Windows MSI + NSIS
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: iDo-Windows-installers
          path: |
            Tauri/ido-desktop/src-tauri/target/release/bundle/msi/*.msi
            Tauri/ido-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Linux AppImage + deb
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: iDo-Linux-packages
          path: |
            Tauri/ido-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            Tauri/ido-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
